[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[project]
version = "20260720.0"
name = "ssc4frames"
description = "Joint Identification and Induction of Semantic Frames"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Steffen Remus", email = "remstef@github.com" },
    { name = "Fabian Barteld", email = "fab-bar@github.com" },
]
maintainers = [
    { name = "Steffen Remus", email = "remstef@github.com" },
    { name = "Fabian Barteld", email = "fab-bar@github.com" },
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
keywords = ["classification", "clustering", "semi-supervised clustering", "graph clustering", "machine learning"]
classifiers = [
    # https://pypi.org/classifiers/
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click~=8.1",
    "click-option-group~=0.5.9",
    "conllu~=4.5",
    "dvc~=3.64",
    "factory-manager~=0.1.0",
    "networkx~=3.6",
    "nltk~=3.9",
    "numpy~=2.4",
    "pandas[excel]~=2.2",
    "pgvector~=0.2",
    "prompt-toolkit~=3.0.50",
    "psycopg2-binary~=2.9",
    "pyclustering~=0.10",
    "python-dotenv~=1.0.1",
    "sentencepiece~=0.2",
    "sqlalchemy~=2.0",
    "sqlalchemy-json~=0.7",
    "transformers~=5.10",
    "ptgcl",
]

[project.optional-dependencies]
torch = [
    "torch>=2,<3"
]
dev = [
    "pytest",
    "black"
]

[project.urls]
Homepage = "https://github.com/remstef/ssc4frames"
Repository = "https://github.com/remstef/ssc4frames"
Documentation = "https://github.com/remstef/ssc4frames/docs"
Issues = "https://github.com/remstef/ssc4frames/issues"
Changelog = "https://github.com/remstef/ssc4frames/blob/master/CHANGELOG.md"

[project.scripts]
ssc4frames = "ssc4frames.cli.main:main"
ssc4frames-yamada-parameters = "ssc4frames.get_yamada_parameters:main"

[tool.poetry]
packages = [
    { include = "ssc4frames", from = "src" }
]

[tool.poetry.build]
generate-setup-file = false

[tool.uv.sources]
ptgcl = { path = "pkg/ptgcl-20260701.3.tar.gz" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
