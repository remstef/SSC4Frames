schema: '2.0'
stages:
  prepare_salsa:
    cmd: python ./data/salsa/convert_salsa.py
    deps:
    - path: ./data/salsa/convert_salsa.py
      hash: md5
      md5: e6ac6bb9c30d4ad189b7c6deeb99d0bf
      size: 7097
