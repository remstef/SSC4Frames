      size: 37
  db_load_embeddings_salsa_bert_base_german_cased:
    cmd:
    - ssc4frames data import-model-embeddings -d salsa -m bert-base-german-cased
      -v 768 -ms -um -p first
    - mkdir -p ./experiments/.database/salsa-default_embeddings
    - ssc4frames data get-embeddings-hash salsa-default bert-base-german-cased >
      ./experiments/.database/salsa-default_embeddings/bert-base-german-cased
    - ssc4frames data get-embeddings-hash salsa-default 
