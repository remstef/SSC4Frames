      size: 4613192
  db_load_dataset_salsa_default:
    cmd:
    - python cli.py data import-dataset -d salsa
    - mkdir -p ../experiments/.database
    - python cli.py data get-datasetsplit-hash salsa-default > 
      ../experiments/.database/salsa-default
