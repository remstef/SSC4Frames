    outs:
    - path: ./data/salsa/salsa.csv
      hash: md5
      md5: 24e2b83f022a8129367be05541587656
      size: 4613192
  db_load_dataset_salsa_default:
    cmd:
    - ssc4frames data import-dataset -d salsa
    - mkdir -p ./experiments/.database
    - ssc4frames data get-datasetsplit-hash salsa-default > 
      ./experiments/.database/salsa-default
    deps:
    - path: ./data/salsa/salsa.csv
      hash: md5
      md5: 24e2b83f022a8129367be05541587656
