  db_load_embeddings_salsa_bert_base_german_cased:
    cmd:
    - python cli.py data import-model-embeddings -d salsa -m 
      bert-base-german-cased -v 768 -ms -um -p first
    - mkdir -p ../experiments/.database/salsa-default_embeddings
    - python cli.py data get-embeddings-hash salsa-default 
      bert-base-german-cased > 
      ../experiments/.database/salsa-default_embeddings/bert-base-german-cased
    - python cli.py data get-embeddings-hash salsa-default 
